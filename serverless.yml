service: driving-school-backend
frameworkVersion: "3"

custom:
  drivingSchoolTable: "${sls:stage}-driving-school-account"
  superAdminTable: "${sls:stage}-driving-school-super-admin"
  adminTable: "${sls:stage}-driving-school-admin"
  studentTable: "${sls:stage}-driving-school-student"
  courseTable: "${sls:stage}-driving-school-course"
  sectionTable: "${sls:stage}-driving-school-section"
  chapterTable: "${sls:stage}-driving-school-chapter"
  subChapterTable: "${sls:stage}-driving-school-sub-chapter"
  questionTable: "${sls:stage}-driving-school-question"
  resultTable: "${sls:stage}-driving-school-result"
  couponTable: "${sls:stage}-driving-school-coupon"
  affiliationTable: "${sls:stage}-driving-school-affiliation"
  imagesBucket: "${sls:stage}-driving-school-backend-images"
  s3:
    host: localhost
    directory: src/s3_local
    port: 8001
  serverless-offline:
    httpPort: 5000
    noPrependStageInUrl: true
  serverless-dynamodb:
    start:
      optimizeDbBeforeStartup: false
      migrate: true
      port: 8000
      dbPath: "./"
      shareDb: true
      seed: true
    seed:
      domain:
        sources:
          - table: ${self:custom.superAdminTable}
            sources: [./seed/DrivingSchoolSuperAdmin.json]
          - table: ${self:custom.adminTable}
            sources: [./seed/DrivingSchoolAdmin.json]
          - table: ${self:custom.drivingSchoolTable}
            sources: [./seed/DrivingSchoolAccount.json]
          - table: ${self:custom.courseTable}
            sources: [./seed/DrivingSchoolCourse.json]
          - table: ${self:custom.studentTable}
            sources: [./seed/DrivingSchoolStudent.json]
          - table: ${self:custom.sectionTable}
            sources: [./seed/DrivingSchoolSection.json]
          - table: ${self:custom.chapterTable}
            sources: [./seed/DrivingSchoolChapter.json]
          - table: ${self:custom.subChapterTable}
            sources: [./seed/DrivingSchoolSubChapter.json]
          - table: ${self:custom.questionTable}
            sources: [./seed/DrivingSchoolQuestion.json]
          - table: ${self:custom.resultTable}
            sources: [./seed/DrivingSchoolResult.json]
          - table: ${self:custom.couponTable}
            sources: [./seed/DrivingSchoolCoupon.json]

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::GetAtt: [DrivingSchoolTable, Arn]
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::GetAtt: [SuperAdminTable, Arn]
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::GetAtt: [AdminTable, Arn]
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::GetAtt: [StudentTable, Arn]
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::GetAtt: [CourseTable, Arn]
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::GetAtt: [SectionTable, Arn]
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::GetAtt: [ChapterTable, Arn]
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::GetAtt: [SubChapterTable, Arn]
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::GetAtt: [QuestionTable, Arn]
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::GetAtt: [ResultTable, Arn]
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::GetAtt: [CouponTable, Arn]
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::GetAtt: [AffiliationTable, Arn]
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
            - s3:ListBucket
          Resource:
            - "arn:aws:s3:::${self:custom.imagesBucket}/*"
            - "arn:aws:s3:::${self:custom.imagesBucket}"

  environment:
    DRIVING_SCHOOL_TABLE: ${self:custom.drivingSchoolTable}
    SUPER_ADMIN_TABLE: ${self:custom.superAdminTable}
    ADMIN_TABLE: ${self:custom.adminTable}
    STUDENT_TABLE: ${self:custom.studentTable}
    COURSE_TABLE: ${self:custom.courseTable}
    SECTION_TABLE: ${self:custom.sectionTable}
    CHAPTER_TABLE: ${self:custom.chapterTable}
    SUB_CHAPTER_TABLE: ${self:custom.subChapterTable}
    QUESTION_TABLE: ${self:custom.questionTable}
    RESULT_TABLE: ${self:custom.resultTable}
    COUPON_TABLE: ${self:custom.couponTable}
    AFFILIATION_TABLE: ${self:custom.affiliationTable}
    IMAGES_BUCKET: ${self:custom.imagesBucket}
    API_KEY: ${env:API_KEY}
    SUPER_ADMIN_JWT_SECRET: ${env:SUPER_ADMIN_JWT_SECRET}
    ADMIN_JWT_SECRET: ${env:ADMIN_JWT_SECRET}
    STUDENT_JWT_SECRET: ${env:STUDENT_JWT_SECRET}
    REFRESH_JWT_SECRET: ${env:REFRESH_JWT_SECRET}
    CRYPTO_SECRET: ${env:CRYPTO_SECRET}
    CRYPTO_IV: ${env:CRYPTO_IV}
    EMAIL_USER: ${env:EMAIL_USER}
    EMAIL_APP_PASSWORD: ${env:EMAIL_APP_PASSWORD}
    EMAILJS_SERVICE_ID: ${env:EMAILJS_SERVICE_ID}
    EMAILJS_TEMPLATE_ID: ${env:EMAILJS_TEMPLATE_ID}
    EMAILJS_PUBLIC_KEY: ${env:EMAILJS_PUBLIC_KEY}
    EMAILJS_PRIVATE_KEY: ${env:EMAILJS_PRIVATE_KEY}
    ADMIN_EMAIL_RECEIVER: ${env:ADMIN_EMAIL_RECEIVER}
    IS_PRODUCTION: ${env:IS_PRODUCTION}
    STAGE: ${sls:stage}

functions:
  api:
    name: ${sls:stage}-driving-school-backend-api
    handler: src/app.handler
    timeout: 300
    events:
      - httpApi: "*"

resources:
  Resources:
    DrivingSchoolTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: drivingSchoolID
            AttributeType: S
          - AttributeName: drivingSchoolName
            AttributeType: S
        KeySchema:
          - AttributeName: drivingSchoolID
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:custom.drivingSchoolTable}
        GlobalSecondaryIndexes:
          - IndexName: DrivingSchoolNameIndex
            KeySchema:
              - AttributeName: drivingSchoolName
                KeyType: HASH
            Projection:
              ProjectionType: ALL
    SuperAdminTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: superAdminUserName
            AttributeType: S
        KeySchema:
          - AttributeName: superAdminUserName
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:custom.superAdminTable}
    AdminTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: drivingSchoolID
            AttributeType: S
          - AttributeName: adminUserName
            AttributeType: S
        KeySchema:
          - AttributeName: adminUserName
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:custom.adminTable}
        GlobalSecondaryIndexes:
          - IndexName: DrivingSchoolIndex
            KeySchema:
              - AttributeName: drivingSchoolID
                KeyType: HASH
            Projection:
              ProjectionType: ALL
    StudentTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: drivingSchoolID
            AttributeType: S
          - AttributeName: studentUserName
            AttributeType: S
        KeySchema:
          - AttributeName: drivingSchoolID
            KeyType: HASH
          - AttributeName: studentUserName
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:custom.studentTable}
        GlobalSecondaryIndexes:
          - IndexName: DrivingSchoolIndex
            KeySchema:
              - AttributeName: drivingSchoolID
                KeyType: HASH
            Projection:
              ProjectionType: ALL
    CourseTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: courseID
            AttributeType: S
          - AttributeName: drivingSchoolID
            AttributeType: S
        KeySchema:
          - AttributeName: courseID
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:custom.courseTable}
        GlobalSecondaryIndexes:
          - IndexName: DrivingSchoolIndex
            KeySchema:
              - AttributeName: drivingSchoolID
                KeyType: HASH
            Projection:
              ProjectionType: ALL
    SectionTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: sectionID
            AttributeType: S
          - AttributeName: drivingSchoolID
            AttributeType: S
        KeySchema:
          - AttributeName: sectionID
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:custom.sectionTable}
        GlobalSecondaryIndexes:
          - IndexName: DrivingSchoolIndex
            KeySchema:
              - AttributeName: drivingSchoolID
                KeyType: HASH
            Projection:
              ProjectionType: ALL
    ChapterTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: chapterID
            AttributeType: S
          - AttributeName: sectionID
            AttributeType: S
        KeySchema:
          - AttributeName: chapterID
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:custom.chapterTable}
        GlobalSecondaryIndexes:
          - IndexName: SectionIndex
            KeySchema:
              - AttributeName: sectionID
                KeyType: HASH
            Projection:
              ProjectionType: ALL
    SubChapterTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: sectionID
            AttributeType: S
          - AttributeName: subChapterID
            AttributeType: S
          - AttributeName: chapterID
            AttributeType: S
        KeySchema:
          - AttributeName: subChapterID
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:custom.subChapterTable}
        GlobalSecondaryIndexes:
          - IndexName: SectionIndex
            KeySchema:
              - AttributeName: sectionID
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: ChapterIndex
            KeySchema:
              - AttributeName: chapterID
                KeyType: HASH
            Projection:
              ProjectionType: ALL
    QuestionTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: questionID
            AttributeType: S
          - AttributeName: chapterID
            AttributeType: S
          - AttributeName: sectionID
            AttributeType: S
          - AttributeName: drivingSchoolID
            AttributeType: S
        KeySchema:
          - AttributeName: questionID
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:custom.questionTable}
        GlobalSecondaryIndexes:
          - IndexName: ChapterIndex
            KeySchema:
              - AttributeName: chapterID
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: SectionIndex
            KeySchema:
              - AttributeName: sectionID
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: DrivingSchoolIndex
            KeySchema:
              - AttributeName: drivingSchoolID
                KeyType: HASH
            Projection:
              ProjectionType: ALL
    ResultTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: resultID
            AttributeType: S
          - AttributeName: chapterID
            AttributeType: S
          - AttributeName: sectionID
            AttributeType: S
          - AttributeName: studentUserName
            AttributeType: S
          - AttributeName: drivingSchoolID
            AttributeType: S
        KeySchema:
          - AttributeName: resultID
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:custom.resultTable}
        GlobalSecondaryIndexes:
          - IndexName: ChapterIndex
            KeySchema:
              - AttributeName: chapterID
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: SectionIndex
            KeySchema:
              - AttributeName: sectionID
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: StudentIndex
            KeySchema:
              - AttributeName: drivingSchoolID
                KeyType: HASH
              - AttributeName: studentUserName
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
    CouponTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: drivingSchoolID
            AttributeType: S
          - AttributeName: couponCode
            AttributeType: S
        KeySchema:
          - AttributeName: drivingSchoolID
            KeyType: HASH
          - AttributeName: couponCode
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:custom.couponTable}
        GlobalSecondaryIndexes:
          - IndexName: DrivingSchoolIndex
            KeySchema:
              - AttributeName: drivingSchoolID
                KeyType: HASH
            Projection:
              ProjectionType: ALL
    AffiliationTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: affiliationID
            AttributeType: S
          - AttributeName: affiliationCode
            AttributeType: S
          - AttributeName: drivingSchoolID
            AttributeType: S
        KeySchema:
          - AttributeName: affiliationID
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:custom.affiliationTable}
        GlobalSecondaryIndexes:
          - IndexName: AffiliationCodeIndex
            KeySchema:
              - AttributeName: drivingSchoolID
                KeyType: HASH
              - AttributeName: affiliationCode
                KeyType: RANGE
            Projection:
              ProjectionType: KEYS_ONLY
          - IndexName: DrivingSchoolIndex
            KeySchema:
              - AttributeName: drivingSchoolID
                KeyType: HASH
            Projection:
              ProjectionType: ALL
    ImagesBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.imagesBucket}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          IgnorePublicAcls: false
          BlockPublicPolicy: false
          RestrictPublicBuckets: false
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins: ["*"]
              AllowedMethods: ["GET", "HEAD"]
              AllowedHeaders: ["*"]
    ImagesBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref ImagesBucket
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - "s3:GetObject"
              Resource:
                - !Join ["/", [!GetAtt [ImagesBucket, Arn], "*"]]
              Principal: "*"

useDotenv: true

plugins:
  - serverless-dynamodb
  - serverless-offline
  - serverless-s3-local
