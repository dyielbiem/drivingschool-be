service: driving-school-admin
frameworkVersion: "3"

custom:
  drivingSchoolTable: "DrivingSchoolAccount"
  superAdminTable: "DrivingSchoolSuperAdmin"
  adminTable: "DrivingSchoolAdmin"
  studentTable: "DrivingSchoolStudent"
  courseTable: "DrivingSchoolCourse"
  serverless-dynamodb:
    start:
      optimizeDbBeforeStartup: false
      migrate: true
      port: 8000
      dbPath: "./"
      inMemory: false
      shareDb: true
      seed: true
    seed:
      domain:
        sources:
          - table: ${self:custom.superAdminTable}
            sources: [./seed/DrivingSchoolSuperAdmin.json]
          - table: ${self:custom.adminTable}
            sources: [./seed/DrivingSchoolAdmin.json]
          - table: ${self:custom.drivingSchoolTable}
            sources: [./seed/DrivingSchoolAccount.json]
          - table: ${self:custom.courseTable}
            sources: [./seed/DrivingSchoolCourse.json]
          - table: ${self:custom.studentTable}
            sources: [./seed/DrivingSchoolStudent.json]

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::GetAtt: [DrivingSchoolTable, Arn]
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::GetAtt: [SuperAdminTable, Arn]
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::GetAtt: [AdminTable, Arn]
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::GetAtt: [StudentTable, Arn]
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::GetAtt: [CourseTable, Arn]
  environment:
    DRIVING_SCHOOL_TABLE: ${self:custom.drivingSchoolTable}
    SUPER_ADMIN_TABLE: ${self:custom.superAdminTable}
    ADMIN_TABLE: ${self:custom.adminTable}
    STUDENT_TABLE: ${self:custom.studentTable}
    COURSE_TABLE: ${self:custom.courseTable}
    API_KEY: ${env:API_KEY}
    SUPER_ADMIN_JWT_SECRET: ${env:SUPER_ADMIN_JWT_SECRET}
    ADMIN_JWT_SECRET: ${env:ADMIN_JWT_SECRET}
    STUDENT_JWT_SECRET: ${env:STUDENT_JWT_SECRET}
    CRYPTO_SECRET: ${env:CRYPTO_SECRET}
    CRYPTO_IV: ${env:CRYPTO_IV}

functions:
  api:
    handler: src/app.handler
    timeout: 20
    events:
      - httpApi: "*"

resources:
  Resources:
    DrivingSchoolTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: drivingSchoolID
            AttributeType: S
          - AttributeName: drivingSchoolName
            AttributeType: S
        KeySchema:
          - AttributeName: drivingSchoolID
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:custom.drivingSchoolTable}
        GlobalSecondaryIndexes:
          - IndexName: DrivingSchoolNameIndex
            KeySchema:
              - AttributeName: drivingSchoolName
                KeyType: HASH
            Projection:
              ProjectionType: ALL
    SuperAdminTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: superAdminUserName
            AttributeType: S
        KeySchema:
          - AttributeName: superAdminUserName
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:custom.superAdminTable}
    AdminTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: drivingSchoolID
            AttributeType: S
          - AttributeName: adminUserName
            AttributeType: S
        KeySchema:
          - AttributeName: drivingSchoolID
            KeyType: HASH
          - AttributeName: adminUserName
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:custom.adminTable}
    StudentTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: drivingSchoolID
            AttributeType: S
          - AttributeName: studentUserName
            AttributeType: S
        KeySchema:
          - AttributeName: drivingSchoolID
            KeyType: HASH
          - AttributeName: studentUserName
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:custom.studentTable}
        GlobalSecondaryIndexes:
          - IndexName: DrivingSchoolIndex
            KeySchema:
              - AttributeName: drivingSchoolID
                KeyType: HASH
            Projection:
              ProjectionType: ALL
    CourseTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: courseID
            AttributeType: S
          - AttributeName: drivingSchoolID
            AttributeType: S
        KeySchema:
          - AttributeName: courseID
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:custom.courseTable}
        GlobalSecondaryIndexes:
          - IndexName: DrivingSchoolIndex
            KeySchema:
              - AttributeName: drivingSchoolID
                KeyType: HASH
            Projection:
              ProjectionType: ALL

useDotenv: true

plugins:
  - serverless-dynamodb
  - serverless-offline
