service: driving-school-admin
frameworkVersion: "3"

custom:
  superAdminTable: "DrivingSchoolSuperAdmin"
  adminTable: "DrivingSchoolAdmin"
  drivingSchoolTable: "DrivingSchoolAccount"
  courseTable: "DrivingSchoolCourse"
  serverless-dynamodb:
    start:
      migrate: true
      port: 8000
      dbPath: "./"
      inMemory: false
      shareDb: true

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:*
          Resource:
            - Fn::GetAtt: [DrivingSchoolTable, Arn]
        - Effect: Allow
          Action:
            - dynamodb:*
          Resource:
            - Fn::GetAtt: [SuperAdminTable, Arn]
        - Effect: Allow
          Action:
            - dynamodb:*
          Resource:
            - Fn::GetAtt: [AdminTable, Arn]
        - Effect: Allow
          Action:
            - dynamodb:*
          Resource:
            - Fn::GetAtt: [CourseTable, Arn]
  environment:
    DRIVING_SCHOOL_TABLE: ${self:custom.drivingSchoolTable}
    SUPER_ADMIN_TABLE: ${self:custom.superAdminTable}
    ADMIN_TABLE: ${self:custom.adminTable}
    COURSE_TABLE: ${self:custom.courseTable}
    API_KEY: ${env:API_KEY}
    SUPER_ADMIN_JWT_SECRET: ${env:SUPER_ADMIN_JWT_SECRET}
    ADMIN_JWT_SECRET: ${env:ADMIN_JWT_SECRET}
    STUDENT_JWT_SECRET: ${env:STUDENT_JWT_SECRET}

functions:
  api:
    handler: src/app.handler
    events:
      - httpApi: "*"

resources:
  Resources:
    DrivingSchoolTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: drivingSchoolName
            AttributeType: S
        KeySchema:
          - AttributeName: drivingSchoolName
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:custom.drivingSchoolTable}
    SuperAdminTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: userName
            AttributeType: S
        KeySchema:
          - AttributeName: userName
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:custom.superAdminTable}
    AdminTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: drivingSchoolName
            AttributeType: S
          - AttributeName: adminUserName
            AttributeType: S
        KeySchema:
          - AttributeName: drivingSchoolName
            KeyType: HASH
          - AttributeName: adminUserName
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:custom.adminTable}
    CourseTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: drivingSchoolName
            AttributeType: S
          - AttributeName: courseName
            AttributeType: S
        KeySchema:
          - AttributeName: drivingSchoolName
            KeyType: HASH
          - AttributeName: courseName
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:custom.courseTable}

useDotenv: true

plugins:
  - serverless-dynamodb
  - serverless-offline
